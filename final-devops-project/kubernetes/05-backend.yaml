apiVersion: apps/v1
kind: Deployment
metadata:
  name: loanboard-backend
  namespace: loanboard
  labels:
    app: loanboard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loanboard-backend
  template:
    metadata:
      labels:
        app: loanboard-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/apurvdugar/loanboard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: loanboard-secrets
                  key: DATABASE_URL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: loanboard-config
                  key: ENVIRONMENT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loanboard-backend
  namespace: loanboard
  labels:
    app: loanboard-backend
spec:
  type: ClusterIP
  selector:
    app: loanboard-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
