apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loanboard-backend-monitor
  namespace: loanboard
  labels:
    release: monitoring
    app: loanboard-backend
spec:
  selector:
    matchLabels:
      app: loanboard-backend
  namespaceSelector:
    matchNames:
      - loanboard
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
