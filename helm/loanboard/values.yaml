frontend:
  image: ghcr.io/apurvdugar/loanboard-frontend
  tag: latest
backend:
  image: ghcr.io/apurvdugar/loanboard-backend
  tag: latest
replicaCount: 2
namespace: loanboard
imagePullSecrets: []
postgres:
  host: loanboard-postgres
  database: loanboard
  username: loanboard
  password: loanboard
ingress:
  enabled: false
  host: loanboard.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
