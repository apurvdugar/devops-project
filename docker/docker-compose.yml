services:
  postgres:
    image: postgres:16-alpine
    container_name: loanboard-postgres
    restart: always
    environment:
      POSTGRES_DB: loanboard
      POSTGRES_USER: loanboard
      POSTGRES_PASSWORD: loanboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../application/backend
      dockerfile: Dockerfile
    container_name: loanboard-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://loanboard:loanboard@postgres:5432/loanboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../application/frontend
      dockerfile: Dockerfile
    container_name: loanboard-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
